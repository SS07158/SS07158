<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Saad Shaikh currently learning roadmap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B14"/>
      <stop offset=".5" stop-color="#111426"/>
      <stop offset="1" stop-color="#090B14"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset=".5" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow { stroke-dasharray: 9 14; animation: flow 4s linear infinite; }
      .node { animation: node 2.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .node2 { animation: node 2.8s ease-in-out infinite .55s; transform-box: fill-box; transform-origin: center; }
      .node3 { animation: node 2.8s ease-in-out infinite 1.1s; transform-box: fill-box; transform-origin: center; }
      .float { animation: float 4.5s ease-in-out infinite; }
      .cursor { animation: blink 1s steps(2,start) infinite; }
      @keyframes flow { to { stroke-dashoffset: -115; } }
      @keyframes node { 0%,100% { opacity:.45; transform:scale(.82); } 50% { opacity:1; transform:scale(1.18); } }
      @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
      @keyframes blink { 50% { opacity:0; } }
    </style>
  </defs>

  <rect width="1000" height="520" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="996" height="516" rx="22" fill="none" stroke="#7C3AED" stroke-opacity=".5" stroke-width="2"/>

  <g class="float" font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="500" y="55" text-anchor="middle" font-size="27" font-weight="800" letter-spacing="2" fill="#F8FAFC">CURRENTLY LEARNING</text>
    <text x="500" y="82" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" fill="#A78BFA">deepening AI/ML skills • exploring new tools • building projects</text>

    <!-- Roadmap line -->
    <path d="M500 112 V445" stroke="#7C3AED" stroke-opacity=".25" stroke-width="5"/>
    <path d="M500 112 V445" stroke="url(#line)" stroke-width="2.5" class="flow" filter="url(#glow)"/>

    <!-- Moving signal -->
    <circle cx="500" cy="150" r="5" fill="#38BDF8" filter="url(#glow)" class="node"/>

    <!-- Cards -->
    <g>
      <rect x="105" y="105" width="350" height="64" rx="16" fill="#111827" stroke="#7C3AED" stroke-opacity=".65"/>
      <circle cx="138" cy="137" r="8" fill="#A855F7" class="node"/>
      <text x="160" y="132" font-size="17" font-weight="700" fill="#F8FAFC">Machine Learning</text>
      <text x="160" y="153" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#94A3B8">fundamentals • model building • evaluation</text>
    </g>

    <g>
      <rect x="545" y="175" width="350" height="64" rx="16" fill="#111827" stroke="#8B5CF6" stroke-opacity=".65"/>
      <circle cx="578" cy="207" r="8" fill="#A855F7" class="node2"/>
      <text x="600" y="202" font-size="17" font-weight="700" fill="#F8FAFC">Deep Learning</text>
      <text x="600" y="223" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#94A3B8">PyTorch • neural networks • architectures</text>
    </g>

    <g>
      <rect x="105" y="245" width="350" height="64" rx="16" fill="#111827" stroke="#A855F7" stroke-opacity=".65"/>
      <circle cx="138" cy="277" r="8" fill="#38BDF8" class="node3"/>
      <text x="160" y="272" font-size="17" font-weight="700" fill="#F8FAFC">Transformers</text>
      <text x="160" y="293" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#94A3B8">attention • representations • modern NLP</text>
    </g>

    <g>
      <rect x="545" y="315" width="350" height="64" rx="16" fill="#111827" stroke="#38BDF8" stroke-opacity=".65"/>
      <circle cx="578" cy="347" r="8" fill="#38BDF8" class="node"/>
      <text x="600" y="342" font-size="17" font-weight="700" fill="#F8FAFC">NLP &amp; LLM Applications</text>
      <text x="600" y="363" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#94A3B8">LLM workflows • practical AI applications</text>
    </g>

    <g>
      <rect x="105" y="385" width="350" height="64" rx="16" fill="#111827" stroke="#38BDF8" stroke-opacity=".75"/>
      <circle cx="138" cy="417" r="8" fill="#38BDF8" class="node2"/>
      <text x="160" y="412" font-size="17" font-weight="700" fill="#F8FAFC">LangChain</text>
      <text x="160" y="433" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" fill="#38BDF8">currently learning</text>
    </g>

    <text x="500" y="482" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#64748B">&gt; Building → Experimenting → Improving<span class="cursor">_</span></text>
  </g>
</svg>
