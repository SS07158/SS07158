<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Saad Shaikh — AI/ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B14"/>
      <stop offset="0.5" stop-color="#111426"/>
      <stop offset="1" stop-color="#090B14"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .float { animation: float 4s ease-in-out infinite; }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .pulse2 { animation: pulse 3.2s ease-in-out infinite .6s; transform-box: fill-box; transform-origin: center; }
      .dash { stroke-dasharray: 7 13; animation: dash 7s linear infinite; }
      .sweep { animation: sweep 3.5s ease-in-out infinite; }
      .blink { animation: blink 1s steps(2,start) infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.8); } 50% { opacity:1; transform:scale(1.25); } }
      @keyframes dash { to { stroke-dashoffset:-140; } }
      @keyframes sweep { 0%,100% { opacity:.35; transform:scaleX(.7); } 50% { opacity:1; transform:scaleX(1); } }
      @keyframes blink { 50% { opacity:0; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="416" rx="22" fill="none" stroke="#7C3AED" stroke-opacity=".55" stroke-width="2"/>

  <!-- Left neural network -->
  <g stroke="#8B5CF6" stroke-opacity=".42" stroke-width="1.5" class="dash">
    <path d="M65 145 L120 105 L170 135 L215 90 L265 130"/>
    <path d="M78 250 L125 205 L178 235 L220 185 L270 225"/>
    <path d="M120 105 L125 205 M170 135 L178 235 M215 90 L220 185 M265 130 L270 225"/>
  </g>
  <g>
    <circle cx="65" cy="145" r="5" fill="#A855F7" class="pulse"/>
    <circle cx="120" cy="105" r="4" fill="#38BDF8" class="pulse2"/>
    <circle cx="170" cy="135" r="5" fill="#A855F7" class="pulse"/>
    <circle cx="215" cy="90" r="4" fill="#38BDF8" class="pulse2"/>
    <circle cx="265" cy="130" r="5" fill="#A855F7" class="pulse"/>
    <circle cx="125" cy="205" r="5" fill="#A855F7" class="pulse2"/>
    <circle cx="178" cy="235" r="4" fill="#38BDF8" class="pulse"/>
    <circle cx="220" cy="185" r="5" fill="#A855F7" class="pulse2"/>
    <circle cx="270" cy="225" r="4" fill="#38BDF8" class="pulse"/>
  </g>

  <!-- Right neural network -->
  <g stroke="#38BDF8" stroke-opacity=".4" stroke-width="1.5" class="dash">
    <path d="M930 105 L985 145 L1040 100 L1095 150 L1145 108"/>
    <path d="M925 235 L980 195 L1035 245 L1090 200 L1145 248"/>
    <path d="M985 145 L980 195 M1040 100 L1035 245 M1095 150 L1090 200"/>
  </g>
  <g>
    <circle cx="930" cy="105" r="4" fill="#38BDF8" class="pulse"/>
    <circle cx="985" cy="145" r="5" fill="#A855F7" class="pulse2"/>
    <circle cx="1040" cy="100" r="4" fill="#38BDF8" class="pulse"/>
    <circle cx="1095" cy="150" r="5" fill="#A855F7" class="pulse2"/>
    <circle cx="1145" cy="108" r="4" fill="#38BDF8" class="pulse"/>
    <circle cx="925" cy="235" r="4" fill="#38BDF8" class="pulse2"/>
    <circle cx="980" cy="195" r="5" fill="#A855F7" class="pulse"/>
    <circle cx="1035" cy="245" r="4" fill="#38BDF8" class="pulse2"/>
    <circle cx="1090" cy="200" r="5" fill="#A855F7" class="pulse"/>
    <circle cx="1145" cy="248" r="4" fill="#38BDF8" class="pulse2"/>
  </g>

  <!-- Main content -->
  <g text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" class="float">
    <text x="600" y="72" font-size="15" font-weight="600" letter-spacing="5" fill="#A78BFA">AI • ML • NLP • LLMs</text>

    <text x="600" y="145" font-size="58" font-weight="800" letter-spacing="2" fill="#F8FAFC">Saad Shaikh</text>

    <!-- Separate, non-overlapping role line -->
    <text x="600" y="205" font-size="32" font-weight="700" fill="url(#title)">AI/ML Engineer</text>

    <g class="sweep" filter="url(#glow)">
      <line x1="455" y1="232" x2="745" y2="232" stroke="#7C3AED" stroke-opacity=".45" stroke-width="2"/>
      <line x1="520" y1="232" x2="680" y2="232" stroke="#38BDF8" stroke-width="2"/>
    </g>

    <text x="600" y="278" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#CBD5E1">
      &gt; Building intelligent systems that solve practical problems
    </text>
    <rect x="795" y="262" width="3" height="20" rx="1.5" fill="#38BDF8" class="blink"/>

    <!-- Skill pills -->
    <g font-size="14" font-weight="600">
      <rect x="330" y="320" width="125" height="34" rx="17" fill="#111827" stroke="#7C3AED" stroke-opacity=".65"/>
      <text x="392.5" y="342" fill="#DDD6FE">Python</text>

      <rect x="470" y="320" width="155" height="34" rx="17" fill="#111827" stroke="#7C3AED" stroke-opacity=".65"/>
      <text x="547.5" y="342" fill="#DDD6FE">Machine Learning</text>

      <rect x="640" y="320" width="140" height="34" rx="17" fill="#111827" stroke="#38BDF8" stroke-opacity=".65"/>
      <text x="710" y="342" fill="#BAE6FD">Deep Learning</text>

      <rect x="795" y="320" width="75" height="34" rx="17" fill="#111827" stroke="#38BDF8" stroke-opacity=".65"/>
      <text x="832.5" y="342" fill="#BAE6FD">NLP</text>
    </g>
  </g>

  <text x="600" y="388" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" fill="#64748B">
    Python · PyTorch · Transformers · FastAPI · Docker · AWS
  </text>
</svg>
